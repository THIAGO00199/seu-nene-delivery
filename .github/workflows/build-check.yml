name: Build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Esbuild isolation check
        run: npx esbuild src/main.jsx --bundle --outfile=/tmp/seu-nene.js --loader:.jsx=jsx --platform=browser
      - name: Vite production build
        run: timeout 60s npm run build
